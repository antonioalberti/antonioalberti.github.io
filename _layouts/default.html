<!DOCTYPE html>
<html lang="{{ page.lang | default: site.default_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  {% seo %}
</head>
<body>
  {% assign t = site.data.i18n[page.lang] %}
  
  <header class="site-header">
    <div class="header-content">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <nav class="site-nav">
        <a href="#about">{{ t.nav.about }}</a>
        <a href="#research">{{ t.nav.research }}</a>
        <a href="#collaborations">{{ t.nav.collaborations }}</a>
        <a href="#contact">{{ t.nav.contact }}</a>
        
        <div class="lang-switcher">
          <a href="{{ '/' | relative_url }}" class="{% if page.lang == 'en' %}active{% endif %}">EN</a>
          <a href="{{ '/pt/' | relative_url }}" class="{% if page.lang == 'pt' %}active{% endif %}">PT</a>
          <a href="{{ '/es/' | relative_url }}" class="{% if page.lang == 'es' %}active{% endif %}">ES</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div>
        {{ t.footer.copyright }} | <a href="{{ site.university.url }}">{{ t.footer.university }}</a>
      </div>
      <div>
        <a href="#top">{{ t.footer.back_to_top }} <i class="fas fa-arrow-up"></i></a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
